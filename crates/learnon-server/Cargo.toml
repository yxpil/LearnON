[package]
name = "learnon-server"
description = "LearnON: a gateway server like Nginx, 100% in Rust (reverse proxy, load balancing, rewrite, virtual hosts)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "learnon"
path = "src/main.rs"

# 自签名证书签发工具：cargo run --bin lon-gencert -- cert.pem key.pem
[[bin]]
name = "lon-gencert"
path = "src/gencert.rs"

# HTTP/3 客户端探针（自研，因本机 curl/node 无 h3）：
#   cargo run --bin lon-h3check -- <ip:port> <sni> <path> <mode=single|streams> [n]
[[bin]]
name = "lon-h3check"
path = "src/h3check.rs"

[features]
default = []
# 平台原生 TLS 后端（Windows=Schannel，Linux/macOS=系统栈），用于协商内置
# rustls 无法提供的旧协议 TLSv1/TLSv1.1。默认关闭以保持纯 Rust；开启后按需
# 依赖 native-tls/tokio-native-tls，legacy 监听自动改走原生握手（HTTP/1.1）。
native-tls = ["dep:native-tls", "dep:tokio-native-tls"]

[dependencies]
learnon-config = { path = "../learnon-config" }
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http-body.workspace = true
http = "1"
bytes.workspace = true
futures-util.workspace = true
regex.workspace = true
chrono.workspace = true
flate2.workspace = true
mlua.workspace = true
thiserror.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
# 反向代理 https/wss 后端的连接器实现 tower_service::Service<Uri>（hyper legacy
# Connect 的公开逃生口）；已在依赖图中（hyper-util 传递依赖），非新增加密栈。
tower-service = "0.3"
rcgen.workspace = true
crossbeam-channel.workspace = true
socket2.workspace = true
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
