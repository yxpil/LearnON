<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" opacity="0.1"/>

  <!-- Gateway symbol - three connected nodes -->
  <g transform="translate(256, 256)">
    <!-- Center node -->
    <circle cx="0" cy="0" r="40" fill="#2563eb"/>

    <!-- Top-right node -->
    <circle cx="80" cy="-60" r="30" fill="#06b6d4"/>

    <!-- Bottom-left node -->
    <circle cx="-80" cy="60" r="30" fill="#06b6d4"/>

    <!-- Connection lines -->
    <line x1="0" y1="0" x2="80" y2="-60" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-80" y2="60" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="-60" x2="-80" y2="60" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Data flow indicators -->
    <circle cx="40" cy="-30" r="6" fill="#06b6d4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-40" cy="30" r="6" fill="#06b6d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.2"/>
</svg>
