# mTLS 上游客户端证书 E2E：证明网关能向**要求客户端证书的 https 后端**出示证书完成双向 TLS。
#   * /mtls/   ：proxy_ssl_verify on + 信任自签 CA + proxy_ssl_name localhost，
#                并附 proxy_ssl_certificate / proxy_ssl_certificate_key → 客户端证书被后端接受，
#                后端回显它校验到的客户端证书 CN（真实 mTLS 握手的直接证据）。
#   * /nomtls/ ：与 /mtls/ 完全相同，唯独**不给客户端证书** → 后端 CERT_REQUIRED 握手中途失败 → 502。
#                这条负例证明"是客户端证书本身"决定了握手成败，而非 CA/名称/端口配置差异。
# 端口与其它套件错开（网关 18455，后端 18454）。后端与三套证书（CA/server/client）由
# tools/mtls_upstream_e2e.py 在临时目录现场生成，绝不入库。
error_log "logs/mtls_upstream_err.log" info;
access_log "logs/mtls_upstream_access.log";

server {
    listen 127.0.0.1:18455;
    server_name mtls-upstream.local;

    # 就绪探针：不碰后端，供 E2E 等待进程起来
    location /ping {
        return 200 "pong";
    }

    location /mtls/ {
        proxy_pass "https://127.0.0.1:18454/";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate "../certs_mtls/ca.crt";
        proxy_ssl_name "localhost";
        proxy_ssl_certificate "../certs_mtls/client.crt";
        proxy_ssl_certificate_key "../certs_mtls/client.key";
    }

    # 负例：要求校验、名称都对，唯独缺客户端证书 → 后端拒绝握手 → 502（进程不崩）
    location /nomtls/ {
        proxy_pass "https://127.0.0.1:18454/";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate "../certs_mtls/ca.crt";
        proxy_ssl_name "localhost";
    }
}
