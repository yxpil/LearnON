# proxy_redirect / proxy_cookie_domain / proxy_cookie_path E2E
# 用真实流量证明：代理响应头改写同时覆盖
#   * 流式缝（convert_upstream_response）——无过滤器的普通代理
#   * 缓冲缝（build_buffered_response）——声明 sub_filter 强制缓冲的代理
# 后端在 tools/proxy_redirect_cookie_e2e.py 里起在 18201，网关监听 18200。
error_log "logs/proxy_redirect_err.log" info;
access_log "logs/proxy_redirect_access.log";

server {
    listen 127.0.0.1:18200;
    server_name redirect.local;

    location /ping { return 200 "pong"; }

    # 流式：字面量前缀 redirect + cookie domain/path 改写
    location /lit/ {
        proxy_pass "http://127.0.0.1:18201";
        proxy_redirect "http://backend.internal:8080" "http://public.example";
        proxy_cookie_domain backend.internal public.example;
        proxy_cookie_path /app /gateway;
    }

    # 流式：proxy_redirect default（上游 origin → 对外 location 前缀，产出相对 Location）
    location /def/ {
        proxy_pass "http://127.0.0.1:18201";
        proxy_redirect default;
    }

    # 流式：正则 redirect + 捕获组替换
    location /regex/ {
        proxy_pass "http://127.0.0.1:18201";
        proxy_redirect "~^http://x:[0-9]+/(.*)$" "https://pub/$1";
    }

    # 流式：proxy_cookie_domain none 删除属性；两条 Set-Cookie 都要各自改写并保留
    location /cookienone/ {
        proxy_pass "http://127.0.0.1:18201";
        proxy_cookie_domain ".backend.internal" none;
    }

    # 流式对照：全部 off → 原样透传（有意偏离 nginx 隐式 default）
    location /off/ {
        proxy_pass "http://127.0.0.1:18201";
        proxy_redirect off;
        proxy_cookie_domain off;
        proxy_cookie_path off;
    }

    # 缓冲缝：sub_filter 强制整体缓冲，Location/cookie 改写同样生效、body 不变
    location /buf/ {
        proxy_pass "http://127.0.0.1:18201";
        proxy_redirect "http://backend.internal:8080" "/pub";
        proxy_cookie_domain backend.internal example.net;
        sub_filter "AAA" "BBB";
    }
}
