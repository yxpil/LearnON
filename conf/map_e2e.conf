# nginx `map` 指令 E2E —— 真实流量证明派生变量在两条解析路径上都生效：
#   * /show (content_by_lua)：ngx.var.<dest> 读到 map 结果（精确/正则/大小写不敏感/
#     正则捕获组 $n/${name}/空串 "" 匹配/default/内置变量作源/未定义返回 nil）；
#   * /echo (proxy_set_header)：config 字符串里的 $dest 经 interpolate_vars 解析后
#     随真实代理转发到后端，后端回显收到的头证明 map 落地。
error_log "logs/map_e2e_err.log" info;

# 经典 WebSocket 升级映射（源=请求头 $http_upgrade，含空串分支）
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ""        close;
}

# 多形态映射：精确、大小写不敏感正则、带捕获组正则（引用 $1）、以内置变量 $scheme 为源
map $http_x_src $kind {
    default            generic;
    ios                mobile;
    ~*^android         mobile;
    ~^/v([0-9]+)$      ver-$1;
}

map $scheme $secure {
    http   insecure;
    https  secure;
}

upstream echoback {
    server 127.0.0.1:18169;
}

server {
    listen 127.0.0.1:18168;
    server_name map.local;

    # map 目标经 Lua ngx.var 读取
    location /show {
        content_by_lua "
            ngx.say('kind='   .. tostring(ngx.var.kind))
            ngx.say('conn='   .. tostring(ngx.var.connection_upgrade))
            ngx.say('secure=' .. tostring(ngx.var.secure))
            ngx.say('undef='  .. tostring(ngx.var.no_such_map))
            -- map 目标可参与 Lua 逻辑判断
            if ngx.var.kind == 'mobile' then
                ngx.say('branch=mobile')
            else
                ngx.say('branch=' .. ngx.var.kind)
            end
        ";
    }

    # map 目标经 proxy_set_header 插值 → 转发到真实后端
    location /echo {
        proxy_pass http://echoback;
        proxy_set_header X-Kind $kind;
        proxy_set_header X-Conn $connection_upgrade;
        proxy_set_header X-Secure $secure;
    }
}
