# https/wss 后端 E2E：证明反向代理能把请求转发到加密后端（TLS over TCP）。
#   * /sec/  ：GET/POST → proxy_pass https:// 后端，proxy_ssl_verify on + 信任自签 CA +
#              proxy_ssl_name localhost（SNI/校验名匹配证书 SAN）。真实校验通过即证明握手+证书链有效。
#   * /wss/  ：WebSocket/Upgrade 隧道，同样经 TLS 后端（后端在 101 后抢发一帧，验证前导字节透传）。
#   * /bad/  ：proxy_ssl_verify on 但未给 trusted_certificate → 建 TLS 配置失败 → 502（不崩溃）。
# 端口与其它套件错开（网关 18444，后端 18443）。后端与证书由 tools/https_backend_e2e.py 现场生成。
error_log "logs/https_backend_err.log" info;
access_log "logs/https_backend_access.log";

server {
    listen 127.0.0.1:18444;
    server_name https-backend.local;

    # 就绪探针：不碰后端，供 E2E 等待进程起来
    location /ping {
        return 200 "pong";
    }

    location /sec/ {
        proxy_pass "https://127.0.0.1:18443/";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate "../certs_https/ca.crt";
        proxy_ssl_name "localhost";
    }

    location /wss/ {
        proxy_pass "https://127.0.0.1:18443/";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate "../certs_https/ca.crt";
        proxy_ssl_name "localhost";
    }

    # 负例：要求校验却没有可信 CA → 明确报错、返回 502
    location /bad/ {
        proxy_pass "https://127.0.0.1:18443/";
        proxy_ssl_verify on;
    }
}
