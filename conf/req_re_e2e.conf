# ngx.re 扩展 + ngx.req.set_header/clear_header E2E —— 真实流量证明：
#   * /re  : ngx.re.gmatch/sub/gsub/回调替换/opt 预编译句柄的返回值逐条对齐；
#   * /hdr : ngx.req.set_header(含多值)/clear_header 改写后可经 get_headers 读回；
#   * /echo: rewrite_by_lua 改写的请求头确实随 proxy 转发到真实后端（后端回显收到哪些头）。
error_log "logs/req_re_e2e_err.log" info;

upstream echoback {
    server 127.0.0.1:18161;
}

server {
    listen 127.0.0.1:18160;
    server_name reqre.local;

    location /ping {
        content_by_lua "ngx.say('pong')";
    }

    # ngx.re 全套：迭代 / 首替 / 全替 / 函数回调 / 预编译句柄复用
    location /re {
        content_by_lua "
            local it = ngx.re.gmatch('a1b2c3', '([a-z])([0-9])')
            local acc = ''
            while true do
                local m = it()
                if not m then break end
                acc = acc .. m[1] .. m[2] .. ','
            end
            ngx.say('gmatch=' .. acc)
            local s1, n1 = ngx.re.sub('hello world foo', '[a-z]+', 'X')
            ngx.say('sub=' .. s1 .. '/' .. n1)
            local s2, n2 = ngx.re.gsub('a-b-c', '-', '_')
            ngx.say('gsub=' .. s2 .. '/' .. n2)
            local s3, n3 = ngx.re.gsub('x1y2', '[0-9]', function(m) return '[' .. m[0] .. ']' end)
            ngx.say('cb=' .. s3 .. '/' .. n3)
            local h = ngx.re.opt('[a-z]+')
            local s4, n4 = ngx.re.gsub('abc1def', h, '*')
            ngx.say('opt=' .. s4 .. '/' .. n4)
        ";
    }

    # set_header/clear_header 改写后 get_headers 读回
    location /hdr {
        content_by_lua "
            ngx.req.set_header('X-Foo', 'bar')
            ngx.req.set_header('X-Multi', {'a', 'b'})
            ngx.req.clear_header('user-agent')
            local hh = ngx.req.get_headers()
            ngx.say('foo=' .. tostring(hh['x-foo']))
            ngx.say('del=' .. tostring(hh['user-agent']))
        ";
    }

    # rewrite_by_lua 改写请求头 → proxy 转发 → 真实后端回显收到的头
    location /echo {
        rewrite_by_lua "
            ngx.req.set_header('X-Added', 'yes')
            ngx.req.set_header('X-Multi', {'v1', 'v2'})
            ngx.req.clear_header('x-drop')
        ";
        proxy_pass http://echoback;
    }
}
