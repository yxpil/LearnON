# HTTP/2 serving E2E：验证 h2 服务在两条路径上真的可用（Node http2 + curl 发真实流量）：
#   * 明文 h2c（prior-knowledge）—— 18124，`http2 on;` 让明文监听嗅探 h2 前导
#   * TLS h2（ALPN 协商 h2）—— 18125，`listen ... ssl http2`
#   * 同一明文端口上 HTTP/1.1 仍应正常（未嗅到前导 → 回落 h1）
# 端口与其它套件错开。证书复用 certs_scenario/（SAN 含 localhost）。
error_log "logs/http2_err.log" info;

# ---- 明文 h2c：prior-knowledge，靠连接前导嗅探区分 h1/h2 ----
server {
    listen 127.0.0.1:18124;
    http2 on;
    server_name h2c.local;

    location / {
        return 200 "h2-cleartext-ok\n";
    }
}

# ---- TLS h2：ALPN 协商 h2 ----
server {
    listen 127.0.0.1:18125 ssl http2;
    server_name h2.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";

    location / {
        return 200 "h2-tls-ok\n";
    }
}
