# nginx `sub_filter` 响应体文本替换 E2E —— 用真实流量证明三条输出路径都会改写：
#   * /proxy /once /rx (proxy_pass)：字面串全替换、once 只替换首个、~正则 + `&` 回填；
#   * /json：Content-Type 非 text/html（默认 sub_filter_types）时不改写；
#   * /lua (content_by_lua)：Lua 产出体经 finish_response 也走 sub_filter；
#   * /s/ (静态 alias)：完整体改写、Range/206 切片不改写。
error_log "logs/sub_filter_e2e_err.log" info;

upstream back {
    server 127.0.0.1:18175;
}

server {
    listen 127.0.0.1:18174;
    server_name subfilter.local;

    # 字面串多条规则 + once off（全替换），默认 text/html 生效
    location /proxy {
        proxy_pass http://back;
        sub_filter "BACKEND_HOST" "REWRITTEN";
        sub_filter "v1.0"         "v9.9";
        sub_filter_once off;
    }

    # 后端返回 application/json：默认 types=text/html → 不应改写
    location /json {
        proxy_pass http://back;
        sub_filter "BACKEND_HOST" "NOPE";
    }

    # once 默认 on：仅替换第一处
    location /once {
        proxy_pass http://back;
        sub_filter "BACKEND_HOST" "Z";
    }

    # ~正则 + 替换串里的 & 回填本次匹配原文（once off 替换全部匹配）
    location /rx {
        proxy_pass http://back;
        sub_filter ~[0-9]+ "N-&";
        sub_filter_once off;
    }

    # content_by_lua 产出的 text/html 体同样受 sub_filter 改写
    location /lua {
        sub_filter "LUA_TOKEN" "LUA_DONE";
        sub_filter_once off;
        content_by_lua "
            ngx.header['content-type'] = 'text/html'
            ngx.say('LUA_TOKEN and LUA_TOKEN')
        ";
    }

    # 静态文件：完整体改写，Range 切片不改写
    location /s/ {
        alias "../public_sub_filter_e2e/";
        sub_filter "STATIC_TOKEN" "S_DONE";
        sub_filter_once off;
    }
}
