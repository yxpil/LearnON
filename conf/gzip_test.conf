# gzip 响应压缩实证测试（端口 127.0.0.1:18097）
error_log "logs/gzip_err.log" info;
access_log "logs/gzip_access.log";

gzip on;
gzip_min_length 100;
gzip_comp_level 9;
gzip_types text/html application/json text/css;

server {
    listen 127.0.0.1:18097;
    server_name gzip.local;
    root "../public_gzip";
    index big.html;

    location / {
    }
}
