# ngx.* 核心 API 补全 E2E —— 用真实流量证明 Batch 1 新增面可用且语义正确：
#   摘要/CRC（md5/md5_bin/sha1_bin/hmac_sha1/crc32_*）、时间（cookie_time/http_time/
#   parse_http_time/today/update_time）、阶段（get_phase/is_subrequest）、worker、
#   config.subsystem/prefix、req.*（read_body/get_body_file/set_body_data/discard_body/
#   get_method/set_method/get_post_args/raw_header）、resp.get_headers。
# 端口与其它套件错开。
error_log "logs/ngx_api_err.log" info;

server {
    listen 127.0.0.1:18131;
    server_name api.local;

    # 摘要 + CRC：与 RFC1321 / RFC2202 / CRC32 已知向量比对（十六进制在 Lua 侧转换）
    location /digest {
        content_by_lua "
            local function tohex(s)
                local o = ''
                for i = 1, #s do o = o .. string.format('%02x', string.byte(s, i)) end
                return o
            end
            ngx.say('md5=', ngx.md5('abc'))
            ngx.say('md5_bin=', tohex(ngx.md5_bin('abc')))
            ngx.say('sha1_hex=', ngx.sha1_bin('abc', true))
            ngx.say('sha1_bin_len=', #ngx.sha1_bin('abc'))
            ngx.say('hmac=', tohex(ngx.hmac_sha1('Jefe', 'what do ya want for nothing?')))
            ngx.say('crc32=', ngx.crc32_short('123456789'))
            ngx.say('crc32_long=', ngx.crc32_long('123456789'))
        ";
    }

    # 时间格式化 / 解析 / today
    location /time {
        content_by_lua "
            ngx.say('cookie0=', ngx.cookie_time(0))
            ngx.say('http0=', ngx.http_time(0))
            ngx.say('parsed=', tostring(ngx.parse_http_time('Thu, 01 Jan 1970 00:00:00 GMT')))
            ngx.say('bad=', tostring(ngx.parse_http_time('garbage')))
            ngx.say('today_len=', #ngx.today())
            ngx.say('update_time=', tostring(ngx.update_time()))
        ";
    }

    # worker + config
    location /meta {
        content_by_lua "
            ngx.say('pid_positive=', tostring(ngx.worker.pid() > 0))
            ngx.say('wid=', tostring(ngx.worker.id()))
            ngx.say('wcount=', tostring(ngx.worker.count()))
            ngx.say('subsystem=', tostring(ngx.config.subsystem))
            ngx.say('server=', tostring(ngx.config.server))
            ngx.say('prefix_nonempty=', tostring(ngx.config.prefix() ~= '' and ngx.config.prefix() ~= nil))
        ";
    }

    # 阶段名 + 子请求标志（顶层请求 is_subrequest=false）
    location /phase {
        content_by_lua "
            ngx.say('phase=', tostring(ngx.get_phase()))
            ngx.say('sub=', tostring(ngx.is_subrequest))
        ";
    }

    # req.*：读取/覆盖/丢弃请求体、方法读写、POST 参数、原始首部
    location /req {
        content_by_lua "
            ngx.req.read_body()
            ngx.say('body_file=', tostring(ngx.req.get_body_file()))
            local pa = ngx.req.get_post_args()
            ngx.say('a=', tostring(pa.a))
            ngx.say('b=', tostring(pa.b))
            ngx.say('method=', ngx.req.get_method())
            local rh = ngx.req.raw_header()
            ngx.say('head_has_method=', tostring(string.find(rh, 'POST') ~= nil))
            ngx.req.set_method('PUT')
            ngx.say('method2=', ngx.req.get_method())
            ngx.req.set_body_data('replaced=1')
            ngx.say('after_set=', ngx.req.get_body_data())
            ngx.req.discard_body()
            ngx.say('after_discard=', tostring(ngx.req.get_body_data()))
        ";
    }

    # resp.get_headers：设置响应头后能读回
    location /resp {
        content_by_lua "
            ngx.header['X-Test'] = 'yes'
            local h = ngx.resp.get_headers()
            ngx.say('xtest=', tostring(h['x-test']))
        ";
    }
}
