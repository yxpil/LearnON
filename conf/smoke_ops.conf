# 运维语义冒烟测试配置（限流/并发/内部跳转/请求体上限/重定向环）
error_log "logs/smoke_err.log" info;
access_log "logs/smoke_access.log";

limit_req_zone $remote_addr zone=rl:1m rate=20r/s burst=5;
limit_conn_zone $binary_remote_addr zone=cc:1m;

server {
    listen 127.0.0.1:18090;
    client_max_body_size 1k;

    location / {
        limit_req zone=rl;
        return 200 "ok";
    }
    location = /private {
        internal;
        return 200 "secret";
    }
    location = /via {
        content_by_lua "ngx.exec('/private')";
    }
    location = /loop {
        rewrite ^ /loop last;
    }
}

server {
    listen 127.0.0.1:18091;
    limit_conn cc 2;

    location / {
        content_by_lua "ngx.sleep(1500) ngx.say('done')";
    }
}
