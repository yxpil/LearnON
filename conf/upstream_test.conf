# ============================================================
# upstream 专项测试（端口 18094）
# 覆盖：平滑加权轮询分布、down 摘除、backup 接管、
#       死节点被动摘除 + 换节点重试、全死 502、health_check 主动摘除
# 配套：upstream_test.py（拉起 9101/9102/9106 三个演示后端）

error_log "logs/upstream_err.log" info;
access_log "logs/upstream_acc.log";
# ============================================================

upstream wrr {
    server 127.0.0.1:9101 weight=3;
    server 127.0.0.1:9102 weight=1;
    server 127.0.0.1:9103 down;
    server 127.0.0.1:9104 backup;
}

upstream flaky {
    server 127.0.0.1:9105 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:9102;
}

upstream dead {
    server 127.0.0.1:9107 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:9108 max_fails=1 fail_timeout=3s;
}

upstream probed {
    server 127.0.0.1:9106;
    server 127.0.0.1:9109;
    health_check interval=1s fails=1 rises=1 uri=/health timeout=1s;
}

upstream stick {
    ip_hash;
    server 127.0.0.1:9101;
    server 127.0.0.1:9102;
}

server {
    listen 127.0.0.1:18094;
    server_name upstream.test;

    location /wrr/ {
        proxy_pass http://wrr;
    }

    location /flaky/ {
        proxy_pass http://flaky;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
    }

    location /dead/ {
        proxy_pass http://dead;
        proxy_connect_timeout 1s;
    }

    location /probed/ {
        proxy_pass http://probed;
        proxy_connect_timeout 1s;
    }

    location /stick/ {
        proxy_pass http://stick;
    }
}
