# resty.http 纯 Lua HTTP 客户端 E2E —— 网关用 resty.http（构建于原生 cosocket 之上）向一个真实
# Python HTTP 后端（127.0.0.1:18146）发起请求，验证 GET/HEAD/POST、Content-Length 与 chunked
# 响应体解析、204 空体、自定义响应头、query 编码、keepalive 连接复用与错误路径。端口与其它套件错开。
error_log "logs/http_e2e_err.log" info;

server {
    listen 127.0.0.1:18145;
    server_name restyhttp.local;

    # GET + Content-Length 体
    location /get_plain {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({ scheme='http', host='127.0.0.1', port=18146, method='GET', path='/plain' })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('body=', res.body)
            ngx.say('cl=', tostring(res.headers['content-length']))
        ";
    }

    # GET + chunked 体（分块重组）
    location /get_chunked {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({ host='127.0.0.1', port=18146, method='GET', path='/chunked' })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('body=', res.body)
            ngx.say('body_len=', tostring(#res.body))
        ";
    }

    # 204 无体
    location /get_204 {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({ host='127.0.0.1', port=18146, method='GET', path='/empty' })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('body_len=', tostring(#res.body))
        ";
    }

    # HEAD 恒空体
    location /head {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({ host='127.0.0.1', port=18146, method='HEAD', path='/plain' })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('body_len=', tostring(#res.body))
        ";
    }

    # POST 回显体
    location /post {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({
                host='127.0.0.1', port=18146, method='POST', path='/echo',
                headers={ ['Content-Type']='application/x-www-form-urlencoded' },
                body='hello=1&x=2',
            })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('echo=', res.body)
        ";
    }

    # 读取自定义响应头
    location /headers {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({ host='127.0.0.1', port=18146, method='GET', path='/headers' })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('x_test=', tostring(res.headers['x-test']))
            ngx.say('ctype=', tostring(res.headers['content-type']))
        ";
    }

    # query 表自动编码进 path
    location /query {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local res, err = c:request({ host='127.0.0.1', port=18146, method='GET', path='/echo', query={ a='1', b='x y' } })
            if not res then ngx.say('err=', tostring(err)) return end
            ngx.say('status=', res.status_code)
            ngx.say('echo=', res.body)
        ";
    }

    # keepalive：同连接两次请求，然后归还池、新客户端复用
    location /keepalive {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            local ok, cerr = c:connect({ host='127.0.0.1', port=18146 })
            if not ok then ngx.say('err=', tostring(cerr)) return end
            local r1 = c:request({ method='GET', path='/plain', keepalive=true })
            local r2 = c:request({ method='GET', path='/plain', keepalive=true })
            local ka = c:set_keepalive(10000, 5)
            -- 新客户端应能从池里复用同一连接
            local c2 = http.new()
            local ok2 = c2:connect({ host='127.0.0.1', port=18146 })
            local r3 = c2:request({ method='GET', path='/plain' })
            ngx.say('s1=', r1 and r1.status_code or 'nil')
            ngx.say('s2=', r2 and r2.status_code or 'nil')
            ngx.say('ka=', tostring(ka))
            ngx.say('s3=', r3 and r3.status_code or 'nil')
        ";
    }

    # 错误路径：连接一个无人监听的端口 → nil, err
    location /badhost {
        content_by_lua "
            local http = require 'resty.http'
            local c = http.new()
            c:set_timeout(1000)
            local res, err = c:request({ host='127.0.0.1', port=18199, method='GET', path='/' })
            ngx.say('res=', tostring(res))
            ngx.say('has_err=', tostring(err ~= nil))
        ";
    }
}
