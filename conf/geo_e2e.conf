# nginx `geo` 指令 E2E —— 真实流量证明按客户端 IP 的派生变量：
#   * 显式源 geo $http_x_ip $net：最长前缀匹配（/16 胜过 /8）、主机 /32、网段、default；
#   * 默认源 geo $remote_addr $from_remote（省略源变量时取 $remote_addr）；
#   * /show 经 Lua ngx.var 读取；/echo 经 proxy_set_header 插值转发到真实回显后端。
error_log "logs/geo_e2e_err.log" info;

# 源=请求头 X-IP（值是 IP）；覆盖 主机/宽网段/更具体网段/另一段/default
geo $http_x_ip $net {
    default           external;
    127.0.0.1         loopback;
    10.0.0.0/8        net10;
    10.1.0.0/16       net10-1;
    192.168.0.0/16    rfc1918;
}

# 省略源变量 → 默认 $remote_addr（本地流量恒为 127.0.0.1，命中 /8）
geo $remote_addr $from_remote {
    127.0.0.0/8       localnet;
    default           remote;
}

upstream echoback {
    server 127.0.0.1:18171;
}

server {
    listen 127.0.0.1:18170;
    server_name geo.local;

    location /show {
        content_by_lua "
            ngx.say('net='  .. tostring(ngx.var.net))
            ngx.say('from='  .. tostring(ngx.var.from_remote))
            if ngx.var.net == 'net10-1' then
                ngx.say('branch=most-specific')
            end
        ";
    }

    location /echo {
        proxy_pass http://echoback;
        proxy_set_header X-Net $net;
        proxy_set_header X-From $from_remote;
    }
}
