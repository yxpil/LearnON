# resolver 指令 + 异步 DNS E2E：用真实流量证明 proxy_pass 的域名走的是非阻塞异步解析，
# 而不是系统 getaddrinfo——test.invalid 是 RFC6761 保留域，系统根本解析不出来，只有
# 配置里指向的存根 DNS 服务器（tools/resolver_e2e.py 起在 18120）能给出 A 记录。
#
#   * /upstream-by-name：域名解析成功 → 连到解析出的 IP，Host 头仍是原始名
#   * /upstream-missing：存根回 NXDOMAIN → 解析失败 → 502（对齐 nginx）
#   * valid=30s 缓存：第二次请求不再向 DNS 服务器发查询（脚本侧计数验证）
#
# 端口与其它套件错开（18119）。
error_log "logs/resolver_err.log" info;
access_log "logs/resolver_access.log";

resolver 127.0.0.1:18120 valid=30s timeout=3s;

server {
    listen 127.0.0.1:18119;
    server_name resolver.local;

    location /upstream-by-name {
        proxy_pass "http://test.invalid:18121";
        proxy_set_header Host test.invalid;
    }

    location /upstream-missing {
        proxy_pass "http://missing.invalid:18121";
        proxy_set_header Host missing.invalid;
    }
}
