# ngx.location.capture 子请求 E2E：用真实流量验证「完整管线」子请求——被捕获的 location
# 可以是 Lua content / return / 带 query / internal-only / 404，也支持子请求里再发子请求
# （嵌套）与自循环深度护栏。端口与其它套件错开（18115）。
error_log "logs/subrequest_err.log" info;
access_log "logs/subrequest_access.log";

server {
    listen 127.0.0.1:18115;
    server_name subreq.local;

    # ---- 被捕获源：Lua content，自定义状态码 + 响应头（internal：仅子请求可达）----
    location /inner {
        internal;
        content_by_lua "
            ngx.status = 201
            ngx.header.set('x-inner', 'yes')
            ngx.say('INNER-BODY')
        ";
    }

    # ---- 被捕获源：return（internal）----
    location /data {
        internal;
        return 200 "static-data";
    }

    # ---- 捕获 Lua 子请求：转发 status/body/header ----
    location /cap_lua {
        content_by_lua "
            local res = ngx.location.capture('/inner')
            ngx.say('status:' .. res.status)
            ngx.say('body:' .. (res.body or 'nil'))
            ngx.say('hdr:' .. tostring(res.header['x-inner']))
        ";
    }

    # ---- 捕获 return 子请求 ----
    location /cap_return {
        content_by_lua "
            local res = ngx.location.capture('/data')
            ngx.say('status:' .. res.status .. ' body:' .. (res.body or 'nil'))
        ";
    }

    # ---- 捕获带 query 的子请求：子请求里读回参数 ----
    location /echo_query {
        internal;
        content_by_lua "
            local a = ngx.req.get_uri_args()
            ngx.say('q=' .. tostring(a.q))
        ";
    }
    location /cap_query {
        content_by_lua "
            local res = ngx.location.capture('/echo_query?q=hello')
            ngx.say(res.body)
        ";
    }

    # ---- 捕获不存在的 location → 子请求 404 ----
    location /cap_404 {
        content_by_lua "
            local res = ngx.location.capture('/does-not-exist')
            ngx.say('status:' .. res.status)
        ";
    }

    # ---- 嵌套：cap_outer 捕获 cap_lua（后者又捕获 /inner）→ 深度 2 ----
    location /cap_outer {
        content_by_lua "
            local res = ngx.location.capture('/cap_lua')
            ngx.say('outer_status:' .. res.status)
            ngx.say('outer_body:' .. (res.body or 'nil'))
        ";
    }

    # ---- 自循环：捕获自身，触发深度护栏（最深一层拿到 status=0，逐级回传 200）----
    location /selfloop {
        content_by_lua "
            local res = ngx.location.capture('/selfloop')
            ngx.say('child:' .. res.status)
        ";
    }

    # ---- 对照组：外部直接访问 internal location 应 404（证明仅子请求可穿透 internal）----
    location /public_root {
        return 200 "root-ok";
    }
}
