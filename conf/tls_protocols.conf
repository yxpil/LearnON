# ssl_protocols E2E：证明内置 rustls 后端能按 nginx 语义显式裁剪协议版本集合。
#   * 18128 ssl_protocols TLSv1.2 → 只协商 TLS1.2；TLS1.3-only 客户端应握手失败
#   * 18129 ssl_protocols TLSv1.3 → 只协商 TLS1.3；TLS1.2-only 客户端应握手失败
#   * 18130 默认（不写 ssl_protocols）→ TLS1.2 与 TLS1.3 都可
# 端口与其它套件错开。证书复用 certs_scenario/（SAN 含 localhost）。
error_log "logs/tls_protocols_err.log" info;

server {
    listen 127.0.0.1:18128 ssl;
    server_name p12.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";
    ssl_protocols TLSv1.2;
    location / { return 200 "only-1.2\n"; }
}

server {
    listen 127.0.0.1:18129 ssl;
    server_name p13.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";
    ssl_protocols TLSv1.3;
    location / { return 200 "only-1.3\n"; }
}

server {
    listen 127.0.0.1:18130 ssl;
    server_name pboth.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";
    location / { return 200 "both\n"; }
}
