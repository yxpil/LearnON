# VM 内 Lua 协程并发冒烟：证明同一 VM 上多条在途请求能在 ngx.sleep 处交错让出，
# 而不是各自独占 VM 串行执行。端口与其它套件错开（18106）。
error_log "logs/concurrency_err.log" info;
access_log "logs/concurrency_access.log";

server {
    listen 127.0.0.1:18106;
    server_name concurrency.local;

    # 单请求睡 0.5s；K 个并发请求若串行（每 VM 一条）则总时长≈ceil(K/vm)*0.5s，
    # 若 VM 内协程并发则总时长≈0.5s。
    location /sleep500 {
        content_by_lua "ngx.sleep(0.5) ngx.say('ok')";
    }

    # 更短睡眠放大并发收益，配合更大并发数
    location /sleep200 {
        content_by_lua "ngx.sleep(0.2) ngx.say('ok')";
    }

    # ngx.ctx 必须跨 sleep 让出保持同一张表（每请求独立、不被其它协程覆盖）
    location /ctxacross {
        content_by_lua "
            ngx.ctx.stage = (ngx.ctx.stage or 0) + 1
            ngx.sleep(0.12)
            ngx.ctx.stage = (ngx.ctx.stage or 0) + 10
            ngx.say(ngx.ctx.stage)
        ";
    }
}
