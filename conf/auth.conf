# auth_basic + allow/deny E2E：用真实 HTTP 流量验证 ACCESS 阶段的 IP 白/黑名单与基本认证。
# 端口与其它套件错开（18114）。
error_log "logs/auth_err.log" info;

server {
    listen 127.0.0.1:18114;
    server_name auth.local;

    # 无需认证，作为对照组
    location /open {
        return 200 "open";
    }

    # HTTP Basic：{SHA} / $apr1$ / 明文 三种口令存储都在同一个 htpasswd 里
    location /private {
        auth_basic "Members Only";
        auth_basic_user_file "auth_demo/htpasswd";
        return 200 "secret-stuff";
    }

    # 只放行回环；本机发起的连接应命中 allow → 200
    location /allow_localhost {
        allow 127.0.0.1/32;
        deny all;
        return 200 "from-localhost";
    }

    # 无条件拒绝 → 403
    location /deny_all {
        deny all;
        return 200 "never";
    }

    # 关闭 server 级继承的测试：显式 auth_basic off 覆盖（这里未设 server 级，仅验证解析）
    location /reopened {
        auth_basic off;
        return 200 "reopened";
    }
}
