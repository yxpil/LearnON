# include E2E 主配置：用 `include vhosts/*.conf;` 把一批 location 片段拼进 server 块。
# 端口与其它套件错开。若 include 生效，/inc_a、/inc_b、/inc_c 才存在。
error_log "logs/include_err.log" info;

server {
    listen 127.0.0.1:18112;
    server_name include.local;

    location /health {
        return 200 "ok";
    }

    # 通配 include：vhosts/ 下所有 *.conf 里定义的 location 被就地拼接进来
    include vhosts/*.conf;
}
