# ============================================================
# 场景模拟配置（本地自签证书，全 HTTPS，端口 9443）
# 场景：双虚拟主机（静态官网 site1.local + JSON API 网关 api.local）
#       负载均衡集群、Lua 鉴权、故障转移、错误页、访问计数
# ============================================================

lua_shared_dict visits 1m;
access_log "logs/scenario.log";

upstream api_cluster {
    server 127.0.0.1:9101 weight=1 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:9102 weight=1 max_fails=2 fail_timeout=5s;
}

# ---------- 虚拟主机 1：静态官网（site1.local） ----------
server {
    listen 9443 ssl;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";
    server_name site1.local;

    root "../public_site1";
    error_page 404 /404.html;

    location / { }

    # 老活动页 301 到新地址
    location = /promo {
        return 301 https://site1.local/promo-2026;
    }
    location = /promo-2026 {
        return 200 "welcome to promo 2026";
    }

    # 访问计数（ngx.shared.DICT）
    location = /visit {
        content_by_lua "
            local d = ngx.shared.visits
            local n = d:incr('site1', 1, 0)
            ngx.say('visit-no=' .. n)
        ";
    }
}

# ---------- 虚拟主机 2：API 网关（api.local） ----------
server {
    listen 9443 ssl;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";
    server_name api.local *.wild.local;

    # API 集群反代
    location /api/ {
        proxy_pass http://api_cluster/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5;
    }

    # Lua 鉴权（content 阶段内完成校验+响应）
    location /secure/ {
        content_by_lua "
            local h = ngx.req.get_headers()
            local token = h['x-token']
            if token == 'admin-token-42' then
                ngx.say('secure area ok, admin')
            elseif token == nil then
                ngx.exit(401)
            else
                ngx.exit(403)
            end
        ";
    }

    # 静态兜底
    location / {
        root "../public_site1";
    }
}
