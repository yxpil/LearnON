# log_by_lua E2E：证明响应成形后 LOG 阶段会运行，能读到最终 ngx.status / 请求信息，
# 且写入共享字典（跨请求累计）。端口与其它套件错开。
error_log "logs/lua_log_err.log" info;
lua_shared_dict logbox 1m;

server {
    listen 127.0.0.1:18109;
    server_name log.local;

    # content 正常 200，log 阶段累计命中数并记录本次 status
    location /hit {
        content_by_lua "ngx.say('served')";
        log_by_lua "
            local d = ngx.shared.logbox
            d:incr('hits', 1, 0)
            d:set('last_status', ngx.status)
            d:set('last_uri', ngx.req.get_path())
            ngx.log(ngx.INFO, 'log_by_lua ran status=', ngx.status)
        ";
    }

    # 一个会 500 的 location：验证 log 阶段看到非 200 状态
    location /boom {
        content_by_lua "ngx.status = 503 ngx.say('nope')";
        log_by_lua "
            local d = ngx.shared.logbox
            d:incr('boom', 1, 0)
            d:set('boom_status', ngx.status)
        ";
    }

    # 读取 log 阶段写入的共享状态
    location /peek {
        content_by_lua "
            local d = ngx.shared.logbox
            ngx.say('hits=', tostring(d:get('hits') or 0))
            ngx.say('last_status=', tostring(d:get('last_status') or 'nil'))
            ngx.say('boom=', tostring(d:get('boom') or 0))
            ngx.say('boom_status=', tostring(d:get('boom_status') or 'nil'))
        ";
    }

    # 复位计数（避免套件间串扰）
    location /reset {
        content_by_lua "ngx.shared.logbox:flush_all() ngx.say('reset')";
    }
}
