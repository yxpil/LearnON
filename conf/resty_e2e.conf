# Batch 4：resty.* 纯 Lua 模块 E2E —— 用真实流量证明 require 加载与语义对齐 OpenResty：
#   resty.string (to_hex / sha256_hex / md5_hex) 与 resty.lock（基于共享字典 add 的分布式互斥锁）。
#   /lock_crit 用 N 个并发请求验证「无锁会丢更新、有 resty.lock 则计数精确」。端口与其它套件错开。
error_log "logs/resty_e2e_err.log" info;
lua_shared_dict lockbox 64k;

server {
    listen 127.0.0.1:18143;
    server_name resty.local;

    # require 可用性探针（诊断）：报告 require 是否存在、加载是否报错
    location /probe {
        content_by_lua "
            ngx.say('has_require=', tostring(type(require) == 'function'))
            local ok, str = pcall(require, 'resty.string')
            ngx.say('load_string=', tostring(ok))
            if not ok then ngx.say('err=', tostring(str)) end
            local ok2, lock = pcall(require, 'resty.lock')
            ngx.say('load_lock=', tostring(ok2))
            if not ok2 then ngx.say('err2=', tostring(lock)) end
        ";
    }

    # resty.string：已知测试向量
    location /str {
        content_by_lua "
            local str = require 'resty.string'
            ngx.say('tohex=', str.to_hex('ABC'))
            ngx.say('sha256=', str.sha256_hex('abc'))
            ngx.say('md5=', str.md5_hex('abc'))
            ngx.say('sha256_empty=', str.sha256_hex(''))
        ";
    }

    # resty.lock：基本加锁/解锁 + 占用时超时
    location /lock_basic {
        content_by_lua "
            local lock = require 'resty.lock'
            local d = ngx.shared.lockbox
            d:delete('b')
            local lk, err = lock:new(d, {timeout=0.3, exptime=1})
            if not lk then ngx.say('newerr=', tostring(err)) return end
            local e1, le1 = lk:lock('b')
            ngx.say('acquire=', tostring(e1 ~= nil))
            ngx.say('acq_elapsed0=', tostring(e1 == 0))
            -- 另一把锁（同 key，不同实例）在 b 仍被持有时应超时
            local lk2 = lock:new('lockbox', {timeout=0.1, exptime=1})
            local e2, le2 = lk2:lock('b')
            ngx.say('contend_nil=', tostring(e2 == nil))
            ngx.say('contend_timeout=', tostring(le2))
            -- 正确解锁后应可再次获取
            local uok = lk:unlock()
            ngx.say('unlocked=', tostring(uok))
            local lk3 = lock:new('lockbox', {timeout=0.3, exptime=1})
            local e3 = lk3:lock('b')
            ngx.say('reacquire=', tostring(e3 ~= nil))
            lk3:unlock()
        ";
    }

    # resty.lock：过期自动释放——预置一把 0.06s 的锁，实例应等待并成功获取（elapsed>0）
    location /lock_expiry {
        content_by_lua "
            local lock = require 'resty.lock'
            local d = ngx.shared.lockbox
            d:set('ex', 999999, 0.06)   -- 模拟他人持有、即将过期
            local lk = lock:new(d, {timeout=1, exptime=1})
            local e, err = lk:lock('ex')
            ngx.say('acquired=', tostring(e ~= nil))
            ngx.say('waited=', tostring(e ~= nil and e > 0))
            if e then lk:unlock() end
        ";
    }

    # 并发临界区：无锁会丢更新；resty.lock 应保证计数精确
    location /lock_crit {
        content_by_lua "
            local lock = require 'resty.lock'
            local d = ngx.shared.lockbox
            local lk, err = lock:new(d, {timeout=3, exptime=3})
            if not lk then ngx.say('criterr=', tostring(err)) return end
            local elapsed, le = lk:lock('crit')
            if not elapsed then ngx.say('criterr=', tostring(le)) return end
            local cur = tonumber(d:get('counter') or '0') or 0
            ngx.sleep(0.02)                 -- 放大竞态窗口：无锁则并发在此交错、丢增量
            d:set('counter', cur + 1)
            lk:unlock()
            ngx.say('done')
        ";
    }

    location /counter {
        content_by_lua "
            local d = ngx.shared.lockbox
            ngx.say('counter=', tostring(d:get('counter')))
        ";
    }

    location /reset {
        content_by_lua "
            local d = ngx.shared.lockbox
            d:delete('counter')
            d:delete('crit')
            ngx.say('reset')
        ";
    }
}
