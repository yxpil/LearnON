# 流式请求体转发冒烟：同一个 upstream，两个 location 分别用 buffering on / off
# 客户端把请求体分小块、块间 sleep 慢速上传；
#   - on  ：代理先整体缓冲，再一次性发给后端（后端读体近乎瞬时，span≈0）
#   - off ：代理边收边转发（后端读到字节的时间跨度≈客户端发送时长）
error_log "logs/stream_err.log" info;
access_log "logs/stream_access.log";

upstream echo {
    server 127.0.0.1:18115;
}

server {
    listen 127.0.0.1:18103;
    server_name stream.local;
    client_max_body_size 10m;
    proxy_read_timeout 30;

    location /buffered/ {
        proxy_pass http://echo;
        proxy_request_buffering on;
    }

    location /stream/ {
        proxy_pass http://echo;
        proxy_request_buffering off;
    }
}
