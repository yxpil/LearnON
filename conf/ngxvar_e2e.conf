# ngx.var E2E —— 用真实 HTTP 流量证明 Lua 侧 nginx 变量可读可写：
#   * 读取 request_uri/uri/method/args/host/http_<name>/remote_addr/remote_port/scheme/server_port/status
#   * 未定义变量返回 nil
#   * 写 $uri 立即读回（改写落到 rewritten_path）、写 $status 影响真实响应码
error_log "logs/ngxvar_e2e_err.log" info;

server {
    listen 127.0.0.1:18154;
    server_name ngxvar.local;

    # 只读：把各类变量拼成 key=value 行返回
    location /echo {
        content_by_lua "
            ngx.say('uri=' .. ngx.var.uri)
            ngx.say('request_uri=' .. ngx.var.request_uri)
            ngx.say('method=' .. ngx.var.request_method)
            ngx.say('args=' .. ngx.var.args)
            ngx.say('query_string=' .. ngx.var.query_string)
            ngx.say('is_args=' .. ngx.var.is_args)
            ngx.say('scheme=' .. ngx.var.scheme)
            ngx.say('server_port=' .. ngx.var.server_port)
            ngx.say('remote_addr=' .. ngx.var.remote_addr)
            local h = ngx.var.host or 'nil'
            ngx.say('host=' .. h)
            ngx.say('x_test=' .. tostring(ngx.var.http_x_test))
            ngx.say('missing=' .. tostring(ngx.var.no_such_var))
            ngx.say('status=' .. ngx.var.status)
        ";
    }

    # POST + 无查询串（is_args 应为空）
    location /post {
        content_by_lua "
            ngx.say('method=' .. ngx.var.request_method)
            ngx.say('is_args=[' .. ngx.var.is_args .. ']')
            ngx.say('args=[' .. ngx.var.args .. ']')
        ";
    }

    # 写 $uri 后立即读回
    location /seturi {
        content_by_lua "
            ngx.var.uri = '/final-target'
            ngx.say('rewritten=' .. ngx.var.uri)
        ";
    }

    # 写 $status：真实响应码应变为 418
    location /setstatus {
        content_by_lua "
            ngx.var.status = 418
            ngx.say('teapot')
        ";
    }
}
