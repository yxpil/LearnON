# 旧协议 TLS 套件（仅在 `--features native-tls` 构建下有意义）：
#   18131 ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3
#         请求了 TLSv1/1.1 → make_acceptor 改走平台原生后端（Windows=Schannel），
#         整段版本区间由原生栈协商，证明 rustls 之外的旧协议真的能握手。
#         若二进制未启用该 feature，此监听回落 rustls，仅提供 TLS1.2/1.3（TLS1.0/1.1 被拒）。
#
# ⚠ 平台原生后端对证书有额外要求：
#   * Schannel 的 Identity::from_pkcs8 只接受 RSA 私钥，无法导入 ECDSA（如 certs_scenario/
#     里的 id-ecPublicKey 证书会报 "ASN1 遇到了不正确的标记值"）。
#   * 因此这里需要一个 RSA 证书/私钥；E2E 套件 tools/tls_legacy_e2e.py 会在临时目录用
#     openssl 现签一张 RSA-2048 自签证书（SAN 含 localhost），用完即删，绝不入库。
#   * 把下面两行指向你自己的 RSA PEM 即可手动跑：
#       cargo build --release --features native-tls -p learnon-server --bin learnon
#       ./target/release/learnon conf/tls_legacy.conf
error_log "logs/tls_legacy_err.log" info;

server {
    listen 127.0.0.1:18131 ssl;
    server_name legacy.local;
    ssl_certificate     "certs_legacy/server.pem";
    ssl_certificate_key "certs_legacy/server.key";
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    location / { return 200 "legacy-ok\n"; }
}
