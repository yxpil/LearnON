# L4 stream{} + ssl_preread E2E —— 用真实 TCP/TLS 流量证明四层代理：
#   * ssl_preread 从 ClientHello 窥探 SNI，据名字路由到不同后端（精确匹配）
#   * sni_match 命名 upstream（复用 L7 选路池）与字面 host:port 两种目标
#   * *.wild.test 通配只命中恰好一级子域
#   * SNI 未命中 → 回落 proxy_pass 默认目标
#   * 无 ssl_preread 的纯四层 proxy_pass（不解析、字节透明）
#
# 网关：18230（preread 路由）、18240（纯转发）
# 后端由 tools/stream_ssl_preread_e2e.py 起在 18231/18233/18234（TLS）与 18241（TCP echo）。
error_log "logs/stream_e2e_err.log" info;

# 命名 upstream：alpha.test 精确匹配时选它，验证四层代理能复用 L7 的池
upstream alpha {
    server 127.0.0.1:18231;
}

stream {
    server {
        listen 127.0.0.1:18230;
        ssl_preread on;
        proxy_pass 127.0.0.1:18234;               # 默认 / 未命中回落
        sni_match alpha.test alpha;               # 命名 upstream
        sni_match "*.wild.test" 127.0.0.1:18233;  # 通配一级子域 → 字面地址
        preread_timeout 3s;
        proxy_connect_timeout 3s;
    }

    server {
        listen 127.0.0.1:18240;                   # 纯四层：不窥探、不终止 TLS
        proxy_pass 127.0.0.1:18241;               # TCP echo 后端
    }
}
