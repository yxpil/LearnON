# ngx.balancer (balancer_by_lua) E2E —— Lua 在转发前选定上游节点。proxy_pass 指向一个"死" upstream
# (127.0.0.1:18999)，balancer_by_lua 用 ngx.balancer.set_current_peer 把连接改到真实后端，用真实
# 流量证明：Lua 选点确实绕开了 upstream 负载均衡、按请求内容分流到不同后端、并按 set_timeouts
# 覆盖读超时。对照 location /dead 无 balancer 时同一 upstream 必然 502。
error_log "logs/balancer_e2e_err.log" info;
lua_shared_dict rr 64k;

# 一个"永远连不上"的命名 upstream：若 balancer 未生效，转发会 502（对照组）
upstream deadpool {
    server 127.0.0.1:18999;
}

server {
    listen 127.0.0.1:18150;
    server_name balancer.local;

    # 就绪探针（不经代理）
    location /ping {
        content_by_lua "ngx.say('pong')";
    }

    # 对照组：无 balancer，代理到死 upstream → 502
    location /dead {
        proxy_pass http://deadpool;
    }

    # 按查询串 ?be=A|B 选点后缀；无 be 时默认 A
    location /pick {
        proxy_pass http://deadpool;
        balancer_by_lua "
            local b = ngx.balancer
            local args = ngx.req.get_uri_args()
            local be = args.be
            if be == 'B' then
                b.set_current_peer('127.0.0.1', 18152)
            else
                b.set_current_peer('127.0.0.1', 18151)
            end
        ";
    }

    # 按请求头 X-Backend 选点（证明 balancer 阶段可读 ngx.req.get_headers）
    location /hdr {
        proxy_pass http://deadpool;
        balancer_by_lua "
            local b = ngx.balancer
            local h = ngx.req.get_headers()
            local be = h['x-backend']
            if be == 'B' then
                b.set_current_peer('127.0.0.1', 18152)
            else
                b.set_current_peer('127.0.0.1', 18151)
            end
        ";
    }

    # set_timeouts 覆盖读超时：选到慢后端(18153, 睡 3s)，但把读超时压到 400ms → 应在 ~0.4s 内 502
    location /to {
        proxy_pass http://deadpool;
        balancer_by_lua "
            local b = ngx.balancer
            b.set_current_peer('127.0.0.1', 18153)
            b.set_timeouts(2000, 2000, 400)
        ";
    }

    # 动态选点（服务发现风格）：共享字典计数器在 A/B 间轮转，真实流量应被均分到两个后端
    location /rr {
        proxy_pass http://deadpool;
        balancer_by_lua "
            local b = ngx.balancer
            local d = ngx.shared.rr
            local n = d:incr('i', 1, 0)
            if n % 2 == 1 then
                b.set_current_peer('127.0.0.1', 18151)
            else
                b.set_current_peer('127.0.0.1', 18152)
            end
        ";
    }
}
