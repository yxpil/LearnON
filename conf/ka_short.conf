# 上游 keep-alive 空闲超时实证：keepalive_timeout 设得很短，
# 相邻请求间隔超过该时长时连接被回收，后端每次都看到新连接。
error_log "logs/ka_short_err.log" info;
access_log "logs/ka_short_access.log";

upstream bk {
    server 127.0.0.1:18111;
    keepalive 16;
    keepalive_timeout 100ms;
}

server {
    listen 127.0.0.1:18102;
    location / {
        proxy_pass http://bk;
    }
}
