# ngx.socket.udp E2E：真实 UDP 数据报往返 + 无应答超时。后端由 tools/sock_udp_e2e.py 拉起：
#   18139 UDP echo（收到数据报回 "UDP:" + 原数据）；18140 故意无监听（receive 超时/拒收）。
error_log "logs/sock_udp_err.log" info;
access_log "logs/sock_udp_access.log";

server {
    listen 127.0.0.1:18138;
    server_name sockudp.local;

    # 数据报往返：setpeername→send→receive
    location /udp {
        content_by_lua "
            local sock = ngx.socket.udp()
            sock:settimeout(2000)
            local ok, err = sock:setpeername('127.0.0.1', 18139)
            if not ok then ngx.say('peer:', err) return end
            local n, serr = sock:send('ping')
            if not n then ngx.say('send:', serr) return end
            local data = sock:receive()
            ngx.say('data:', tostring(data), ' sent:', n)
            sock:close()
        ";
    }

    # 第二个数据报（同一 sock 复用，验证 setpeername 后 send/recv 只对该对端）
    location /udp2 {
        content_by_lua "
            local sock = ngx.socket.udp()
            sock:settimeout(2000)
            sock:setpeername('127.0.0.1', 18139)
            sock:send('one')
            local a = sock:receive()
            sock:send('two')
            local b = sock:receive()
            ngx.say('a:', tostring(a), ' b:', tostring(b))
            sock:close()
        ";
    }

    # 无应答：连到无人监听的 UDP 端口，receive 超时/拒收 → nil + err
    location /udptimeout {
        content_by_lua "
            local sock = ngx.socket.udp()
            sock:settimeout(200)
            local ok, err = sock:setpeername('127.0.0.1', 18140)
            if not ok then ngx.say('peer:', err) return end
            sock:send('x')
            local data, rerr = sock:receive()
            ngx.say('data:', tostring(data), ' err:', tostring(rerr))
            sock:close()
        ";
    }
}
