# resty.redis 纯 Lua RESP 客户端 E2E —— 网关用 resty.redis（构建于原生 cosocket 之上）向一个真实
# RESP 存根服务器（127.0.0.1:18147）发命令，用真实流量证明 SET/GET/INCR/DEL/EXISTS/MGET/PING、
# 动态命令派发、bulk/array/integer/nil/error 回复解析、pipeline/commit、以及 keepalive 连接复用。
error_log "logs/redis_e2e_err.log" info;

server {
    listen 127.0.0.1:18148;
    server_name restyredis.local;

    # 基础命令：动态派发 redis:set/get/incr/del/ping
    location /basic {
        content_by_lua "
            local redis = require 'resty.redis'
            local r = redis:new()
            local ok, err = r:connect('127.0.0.1', 18147)
            if not ok then ngx.say('err=', tostring(err)) return end
            r:del('cnt')
            ngx.say('set=', tostring(r:set('foo', 'bar')))
            ngx.say('get=', tostring(r:get('foo')))
            ngx.say('incr=', tostring(r:incr('cnt')))
            ngx.say('incr2=', tostring(r:incr('cnt')))
            ngx.say('del=', tostring(r:del('foo')))
            ngx.say('ping=', tostring(r:ping()))
            r:close()
        ";
    }

    # nil 回复（GET 缺失键 → false）与 EXISTS 整数 0
    location /nil {
        content_by_lua "
            local redis = require 'resty.redis'
            local r = redis:new()
            r:connect('127.0.0.1', 18147)
            r:del('absent')
            local v = r:get('absent')
            ngx.say('v=', tostring(v))
            ngx.say('exists=', tostring(r:exists('absent')))
            r:close()
        ";
    }

    # 错误回复：未知命令 → nil, err
    location /error {
        content_by_lua "
            local redis = require 'resty.redis'
            local r = redis:new()
            r:connect('127.0.0.1', 18147)
            local ok, err = r:command({'NOOP_XYZ'})
            ngx.say('ok=', tostring(ok))
            ngx.say('has_err=', tostring(err ~= nil and err:find('ERR') ~= nil))
            r:close()
        ";
    }

    # array 回复：MGET
    location /array {
        content_by_lua "
            local redis = require 'resty.redis'
            local r = redis:new()
            r:connect('127.0.0.1', 18147)
            r:set('a', '1')
            r:set('b', '2')
            local res = r:mget('a', 'b', 'zz')
            ngx.say('type=', type(res))
            ngx.say('n=', tostring(res and #res))
            ngx.say('r1=', res and tostring(res[1]) or 'nil')
            ngx.say('r2=', res and tostring(res[2]) or 'nil')
            ngx.say('r3=', res and tostring(res[3]) or 'nil')
            r:close()
        ";
    }

    # pipeline：多条命令批量发送、一次读回
    location /pipeline {
        content_by_lua "
            local redis = require 'resty.redis'
            local r = redis:new()
            r:connect('127.0.0.1', 18147)
            local pipe = r:pipeline()
            pipe:set('p1', 'x')
            pipe:set('p2', 'y')
            pipe:get('p1')
            pipe:incr('pc')
            local replies, err = pipe:commit()
            if not replies then ngx.say('err=', tostring(err)) return end
            ngx.say('n=', tostring(#replies))
            ngx.say('r1=', tostring(replies[1]))
            ngx.say('r3=', tostring(replies[3]))
            ngx.say('r4=', tostring(replies[4]))
            r:close()
        ";
    }

    # keepalive：连接归还池后新客户端复用
    location /keepalive {
        content_by_lua "
            local redis = require 'resty.redis'
            local r = redis:new()
            local ok = r:connect('127.0.0.1', 18147)
            if not ok then ngx.say('err=connect') return end
            local p1 = r:ping()
            local ka = r:set_keepalive(10000, 10)
            local r2 = redis:new()
            local ok2 = r2:connect('127.0.0.1', 18147)
            local p2 = r2:ping()
            ngx.say('p1=', tostring(p1))
            ngx.say('ka=', tostring(ka))
            ngx.say('p2=', tostring(p2))
        ";
    }
}
