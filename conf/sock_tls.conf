# cosocket TLS（sock:tlshandshake）E2E：把明文 TCP cosocket 升级为 rustls 客户端 TLS 流并与真实 TLS 后端往返。
# TLS echo 后端由 tools/sock_tls_e2e.py 拉起（18142，自签 localhost 证书，读一行回 "TLS:"+line）。
# 默认 verify=false（AcceptAll），自签证书即可握手成功。
error_log "logs/sock_tls_err.log" info;
access_log "logs/sock_tls_access.log";

server {
    listen 127.0.0.1:18141;
    server_name socktls.local;

    # 连接→tlshandshake→send→receive(*l)，验证握手 + 在 TLS 流上的收发
    location /tls {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(3000)
            local ok, err = sock:connect('localhost', 18142)
            if not ok then ngx.say('connect:', err) return end
            local tk, terr = sock:tlshandshake({ server_name = 'localhost' })
            if not tk then ngx.say('tls:', terr) return end
            sock:send('secret\\n')
            local line = sock:receive('*l')
            ngx.say('tls:', tostring(tk), ' data:', tostring(line))
            sock:close()
        ";
    }

    # 在 TLS 流上用 receiveany 取定长字节，证明所有 receive 变体都走统一 CosStream
    location /tls_any {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(3000)
            sock:connect('localhost', 18142)
            local tk = sock:tlshandshake({ server_name = 'localhost' })
            if not tk then ngx.say('tls failed') return end
            sock:send('burst\\n')
            local d = sock:receiveany(4, 16)
            ngx.say('any:', tostring(d))
            sock:close()
        ";
    }
}
