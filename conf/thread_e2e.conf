# ngx.thread.* 轻量级线程 E2E —— 用真实流量证明 spawn/wait/yield/kill 语义对齐 OpenResty ngx_lua，
# 并用挂钟时间证明同一 VM 内多条 light thread 真并发（交错跑 ngx.sleep/cosocket）。端口与其它套件错开。
error_log "logs/thread_e2e_err.log" info;
lua_shared_dict flagbox 64k;

server {
    listen 127.0.0.1:18144;
    server_name thread.local;

    # spawn + wait：单线程，返回多个值
    location /basic {
        content_by_lua "
            local ok, a, b, c = ngx.thread.wait(ngx.thread.spawn(function()
                return 'x', 'y', 123
            end))
            ngx.say('ok=', tostring(ok))
            ngx.say('a=', tostring(a))
            ngx.say('b=', tostring(b))
            ngx.say('c=', tostring(c))
        ";
    }

    # 顺序 wait 多个线程，收集各自结果
    location /multi {
        content_by_lua "
            local t1 = ngx.thread.spawn(function() ngx.sleep(0.05); return 1 end)
            local t2 = ngx.thread.spawn(function() return 2 end)
            local t3 = ngx.thread.spawn(function() ngx.sleep(0.02); return 3 end)
            local o1, v1 = ngx.thread.wait(t1)
            local o2, v2 = ngx.thread.wait(t2)
            local o3, v3 = ngx.thread.wait(t3)
            ngx.say('sum=', v1 + v2 + v3)
            ngx.say('allok=', tostring(o1 and o2 and o3))
        ";
    }

    # wait-any：快线程先完成即返回其结果（不等待慢线程）
    location /waitany {
        content_by_lua "
            local slow = ngx.thread.spawn(function() ngx.sleep(0.6); return 'slow' end)
            local fast = ngx.thread.spawn(function() ngx.sleep(0.05); return 'fast' end)
            local ok, who = ngx.thread.wait(slow, fast)
            ngx.say('ok=', tostring(ok))
            ngx.say('who=', tostring(who))
        ";
    }

    # 错误传播：子线程抛错 → wait 返回 ok=false, err
    location /error {
        content_by_lua "
            local t = ngx.thread.spawn(function() error('kaboom') end)
            local o, e = ngx.thread.wait(t)
            ngx.say('ok=', tostring(o))
            ngx.say('has_err=', tostring(e ~= nil and string.find(e, 'kaboom') ~= nil))
        ";
    }

    # kill：中止仍在睡眠的线程，其后续副作用不会发生
    location /kill {
        content_by_lua "
            local d = ngx.shared.flagbox
            d:delete('ran')
            local t = ngx.thread.spawn(function()
                ngx.sleep(3)
                d:set('ran', 'yes')
            end)
            ngx.sleep(0.1)
            ngx.thread.kill(t)
            ngx.sleep(0.2)
            ngx.say('ran=', tostring(d:get('ran')))
        ";
    }

    # wait 一个已被 kill 的线程 → 即时返回 ok=false,'thread killed'
    location /killed_wait {
        content_by_lua "
            local t = ngx.thread.spawn(function() ngx.sleep(3); return 'done' end)
            ngx.thread.kill(t)
            local ok, err = ngx.thread.wait(t)
            ngx.say('ok=', tostring(ok))
            ngx.say('err=', tostring(err))
        ";
    }

    # 真并发：4 条线程各 ngx.sleep(0.4)，串行需 1.6s，并发应 ~0.4s
    location /conc {
        content_by_lua "
            local t0 = ngx.now()
            local ts = {}
            for i = 1, 4 do
                ts[i] = ngx.thread.spawn(function()
                    ngx.sleep(0.4)
                    return i
                end)
            end
            local acc = 0
            for i = 1, 4 do
                local ok, v = ngx.thread.wait(ts[i])
                if ok then acc = acc + v end
            end
            local el = ngx.now() - t0
            ngx.say('acc=', acc)
            ngx.say('elapsed=', string.format('%.2f', el))
            ngx.say('concurrent=', tostring(el < 1.0))
        ";
    }

    # yield：两条线程交替 ngx.thread.yield，写入同一 ngx.ctx 序列，证明交错调度
    location /yield {
        content_by_lua "
            ngx.ctx.seq = {}
            local a = ngx.thread.spawn(function()
                for k = 1, 3 do table.insert(ngx.ctx.seq, 'A') ngx.thread.yield() end
            end)
            local b = ngx.thread.spawn(function()
                for k = 1, 3 do table.insert(ngx.ctx.seq, 'B') ngx.thread.yield() end
            end)
            ngx.thread.wait(a)
            ngx.thread.wait(b)
            ngx.say('seq=', table.concat(ngx.ctx.seq, ''))
            -- 前两次插入应来自不同线程（轮转），即 'AB' 或 'BA' 开头
            local head = string.sub(table.concat(ngx.ctx.seq, ''), 1, 2)
            ngx.say('interleaved=', tostring(head == 'AB' or head == 'BA'))
        ";
    }

    # 非线程对象传入 wait → nil, err
    location /badwait {
        content_by_lua "
            local ok, err = ngx.thread.wait({})
            ngx.say('ok=', tostring(ok))
            ngx.say('err=', tostring(err ~= nil))
        ";
    }
}
