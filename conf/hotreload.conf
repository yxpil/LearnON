# 配置热重载 E2E：证明 LearnON 在**同一进程内**、**不重新绑定监听**的前提下，
# 编辑 conf 后新请求立即用新路由，在途/复用连接不断开（零停机）。
#   reload 200ms;  让热重载任务每 200ms 检查主配置 mtime（mtime 变了才真正重载）
# 端口与其它套件错开（18126）。error_log/pid 相对路径以本 conf 所在目录为基准。
error_log "logs/hotreload_err.log" info;
pid "logs/hotreload.pid";
reload 200ms;

server {
    listen 127.0.0.1:18126;
    server_name hotreload.local;

    # 会被 e2e 就地改写：v1 -> v2 -> (坏配置) -> v3
    location / {
        return 200 "v1\n";
    }

    # 一个不随重载改变的探针端点，用来区分"进程重启" vs "仅路由替换"
    location /still-up {
        return 200 "up\n";
    }
}
