# cosocket（ngx.socket.tcp）E2E：真实 TCP 后端往返 + 让出并发证明。端口与其它套件错开。
# 后端在 tools/cosocket_e2e.py 里拉起：echo=18120（读一行→睡 300ms→回 ECHO:<line>）,
# blackhole=18121（accept 后永不回写，用于超时）。18999 故意无人监听（连接失败）。
error_log "logs/cosocket_err.log" info;
access_log "logs/cosocket_access.log";

server {
    listen 127.0.0.1:18108;
    server_name cosocket.local;

    # 往返：connect + send 一行 + receive *l
    location /echo {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok, err = sock:connect('127.0.0.1', 18120)
            if not ok then ngx.say('connect:', err) return end
            local n, serr = sock:send('hello\\n')
            if not n then ngx.say('send:', serr) return end
            local line, rerr, part = sock:receive('*l')
            if not line then ngx.say('recv:', rerr, ' part:', part or '') return end
            ngx.say('got:', line, ' sent:', n)
            sock:close()
        ";
    }

    # 定长：send 'PINGME\\n' + receive(5) 取回复前 5 字节
    location /exact {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok = sock:connect('127.0.0.1', 18120)
            if not ok then ngx.say('connect failed') return end
            sock:send('PINGME\\n')
            local data, rerr, part = sock:receive(5)
            ngx.say('data:', tostring(data), ' err:', tostring(rerr))
            sock:close()
        ";
    }

    # 超时：连 blackhole，settimeout(150) 后 receive → nil, timeout, 空 partial
    location /timeout {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(150)
            local ok, err = sock:connect('127.0.0.1', 18121)
            if not ok then ngx.say('conn:', err) return end
            sock:send('x\\n')
            local line, rerr, part = sock:receive('*l')
            ngx.say('line:', tostring(line), ' err:', tostring(rerr), ' part:', tostring(part or ''))
            sock:close()
        ";
    }

    # 连接失败：无人监听的端口
    location /connectfail {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(400)
            local ok, err = sock:connect('127.0.0.1', 18999)
            ngx.say('ok:', tostring(ok), ' err:', tostring(err))
            sock:close()
        ";
    }

    # 并发让出：每个请求 connect→(后端睡 300ms)→receive。K 个并发应重叠。
    location /echo_conc {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(3000)
            local ok = sock:connect('127.0.0.1', 18120)
            if not ok then ngx.say('connect failed') return end
            sock:send('q\\n')
            local line = sock:receive('*l')
            ngx.say(line or 'nil')
            sock:close()
        ";
    }
}
