# nginx realip 模块 E2E —— 真实流量证明"$remote_addr 被真实客户端 IP 覆盖，且下游派生变量随之改变"。
#   本机所有连接都来自 127.0.0.1，通过**不同端口=不同 server（不同 set_real_ip_from）**制造可信/不可信对端：
#   * :18180 可信对端 + X-Real-IP        → remote_addr 改写为头里的 IP；geo $net 命中该 IP 的网段。
#   * :18181 不可信对端(10.99/16 不含环回) → 头被忽略，remote_addr 仍是 127.0.0.1；geo $net=localnet（防伪造）。
#   * :18182 X-Forwarded-For, recursive off → 取链中**最右**地址。
#   * :18183 X-Forwarded-For, recursive on  → 跳过可信(198.51/24)，取第一个非可信=真实客户端。
# geo 块源=$remote_addr，跨 server 共享：它看到的正是被改写后的地址，是"下游消费者用真实 IP"的铁证。
error_log "logs/real_ip_e2e_err.log" info;

geo $remote_addr $net {
    default          external;
    203.0.113.0/24   testnet;
    192.0.2.0/24     doc-b;
    127.0.0.0/8      localnet;
}

# ---- 可信 + X-Real-IP ----
server {
    listen 127.0.0.1:18180;
    real_ip_header X-Real-IP;
    set_real_ip_from 127.0.0.0/8;
    location / {
        content_by_lua "
            ngx.say('addr='  .. tostring(ngx.var.remote_addr))
            ngx.say('net='   .. tostring(ngx.var.net))
            ngx.say('seen='  .. tostring(ngx.var.http_x_real_ip))
        ";
    }
}

# ---- 不可信对端：即便带伪造头也不改写 ----
server {
    listen 127.0.0.1:18181;
    real_ip_header X-Real-IP;
    set_real_ip_from 10.99.0.0/16;   # 环回不在其中 → 触发防伪造分支
    location / {
        content_by_lua "
            ngx.say('addr='  .. tostring(ngx.var.remote_addr))
            ngx.say('net='   .. tostring(ngx.var.net))
        ";
    }
}

# ---- XFF, recursive off：取最右 ----
server {
    listen 127.0.0.1:18182;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.0/8;
    location / {
        content_by_lua "
            ngx.say('addr='  .. tostring(ngx.var.remote_addr))
            ngx.say('net='   .. tostring(ngx.var.net))
        ";
    }
}

# ---- XFF, recursive on：跳过可信网段 ----
server {
    listen 127.0.0.1:18183;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 198.51.100.0/24;
    location / {
        content_by_lua "
            ngx.say('addr='  .. tostring(ngx.var.remote_addr))
            ngx.say('net='   .. tostring(ngx.var.net))
        ";
    }
}
