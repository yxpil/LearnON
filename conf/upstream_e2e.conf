# $upstream_* 指标 E2E —— 真实代理流量把后端地址/状态码/响应头耗时记录进 RequestCtx，
# log_by_lua 读 ngx.var.$upstream_* 存入共享字典，再用 /meta 回读断言。
error_log "logs/upstream_e2e_err.log" info;
lua_shared_dict um 64k;

upstream beA {
    server 127.0.0.1:18157;
}

upstream beSlow {
    server 127.0.0.1:18158;
}

server {
    listen 127.0.0.1:18156;
    server_name upstream.local;

    # 就绪探针
    location /ping {
        content_by_lua "ngx.say('pong')";
    }

    # 代理到后端 A：log_by_lua 把 $upstream_* 按 X-Req-Id 存进字典
    location /up {
        proxy_pass http://beA;
        log_by_lua "
            local id = ngx.var.http_x_req_id
            if id then
                local d = ngx.shared.um
                d:set(id .. '.addr', ngx.var.upstream_addr or '')
                d:set(id .. '.status', ngx.var.upstream_status or '')
                d:set(id .. '.hdr', ngx.var.upstream_header_time or '')
                d:set(id .. '.resp', ngx.var.upstream_response_time or '')
            end
        ";
    }

    # 代理到慢后端（睡 ~0.6s 才回头），header 耗时应被真实记录
    location /upslow {
        proxy_pass http://beSlow;
        log_by_lua "
            local id = ngx.var.http_x_req_id
            if id then
                local d = ngx.shared.um
                d:set(id .. '.addr', ngx.var.upstream_addr or '')
                d:set(id .. '.status', ngx.var.upstream_status or '')
                d:set(id .. '.hdr', ngx.var.upstream_header_time or '')
            end
        ";
    }

    # 回读字典里某请求记录的指标
    location /meta {
        content_by_lua "
            local id = (ngx.req.get_uri_args().id or '')
            local d = ngx.shared.um
            ngx.say('addr=' .. tostring(d:get(id .. '.addr')))
            ngx.say('status=' .. tostring(d:get(id .. '.status')))
            ngx.say('hdr=' .. tostring(d:get(id .. '.hdr')))
        ";
    }
}
