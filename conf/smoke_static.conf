# 静态文件语义冒烟：条件请求（ETag / Last-Modified → 304）、Range（206 / 416）、隐藏文件策略
error_log "logs/static_err.log" info;
access_log "logs/static_access.log";

server {
    listen 127.0.0.1:18093;
    server_name static.local;
    root "../public_static";
    index index.html;
    add_header X-Static-Added yes;

    location /docs/ {
        autoindex on;
    }

    location / {
    }
}
