# nginx `split_clients` 指令 E2E —— 用真实流量证明按键模板哈希加权分流的派生变量：
#   * /show (content_by_lua)：ngx.var.<dest> 读到落桶结果（确定性 + 权重分布 + 兜底 *）；
#   * /echo (proxy_set_header)：config 字符串里的 $dest 经 interpolate_vars 解析后随
#     真实代理转发到回显后端，证明两条解析路径（Lua 读取 / config 插值）结果一致。
error_log "logs/split_e2e_err.log" info;

# 四等分：以请求头 X-Key 为键模板，逐请求可变，验证 25% 权重分布
split_clients "${http_x_key}" $roll {
    25%   q1;
    25%   q2;
    25%   q3;
    25%   q4;
}

# 10% + 兜底 *：以内置 $remote_addr 与请求头 User-Agent 拼接为键
split_clients "${remote_addr}${http_user_agent}" $bucket {
    10%   yes;
    *     no;
}

upstream echoback {
    server 127.0.0.1:18173;
}

server {
    listen 127.0.0.1:18172;
    server_name split.local;

    # split 目标经 Lua ngx.var 读取
    location /show {
        content_by_lua "
            ngx.say('roll='   .. tostring(ngx.var.roll))
            ngx.say('bucket=' .. tostring(ngx.var.bucket))
        ";
    }

    # split 目标经 proxy_set_header 插值 → 转发到真实回显后端
    location /echo {
        proxy_pass http://echoback;
        proxy_set_header X-Roll $roll;
        proxy_set_header X-Bucket $bucket;
    }
}
