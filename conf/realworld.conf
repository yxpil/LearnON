# ============================================================
# 真实工作场景模拟（Real-world workload simulation）
# 一个社区站点的一天：静态资源 + CDN 式缓存协商、API 网关反代、
# 登录接口限流、令牌鉴权、WebSocket 聊天、大文件上传、
# 后台定时器健康心跳、故障转移与超时/宕机错误路径。
# 端口：网关 9600（HTTP）；后端 9201/9202；WS 后端 9301；死端口 9799
# ============================================================

lua_shared_dict logins 1m;
lua_shared_dict health 1m;
access_log "logs/realworld.log";

# 启动即注册的后台周期任务（对标 OpenResty init 阶段 + ngx.timer.every）
init_by_lua "
    local h = ngx.shared.health
    h:set('beats', 0)
    ngx.timer.every(2, function(premature)
        if premature then return false end
        local n = h:incr('beats', 1, 0)
        h:set('last_beat', ngx.time(), 30)
        h:set('note', 'beat-' .. n, 30)
    end)
";

upstream app_cluster {
    server 127.0.0.1:9201 weight=1 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:9202 weight=1 max_fails=1 fail_timeout=3s;
}

server {
    listen 9600;
    server_name realworld.local;
    root "../public_realworld";
    index index.html;
    error_page 404 /404.html;

    # --- S1 静态站点：ETag/304/Range/206 由静态模块内建 ---
    location / { }

    # --- S2 老链接 301 迁移 ---
    location = /promo {
        return 301 http://127.0.0.1:9600/promo2026;
    }
    location = /promo2026 {
        return 200 "promo-2026 live";
    }

    # --- S3 API 网关：反代到双节点集群 ---
    location /api/ {
        proxy_pass http://app_cluster/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5;
    }

    # --- S4 大文件上传（6m 上限，字节回显校验完整性） ---
    location /upload/ {
        client_max_body_size 6m;
        proxy_pass http://app_cluster/;
        proxy_read_timeout 30;
    }

    # --- S5 登录限流：固定 10s 窗口最多 5 次 ---
    location = /login {
        content_by_lua "
            local d = ngx.shared.logins
            local win = math.floor(ngx.time() / 10)
            local key = 'w' .. win
            local n = (d:get(key) or 0) + 1
            d:set(key, n, 25)
            if n > 5 then
                ngx.status = 429
                ngx.say('rate limited, try later')
                ngx.exit(429)
            end
            local user = ngx.req.get_uri_args()['user'] or 'anon'
            ngx.say('login ok for ', user, ' attempt=', n)
        ";
    }

    # --- S6 令牌鉴权（401/403/200） ---
    location = /secure {
        content_by_lua "
            local token = ngx.req.get_headers()['x-token']
            if token == 'admin-token-42' then
                ngx.say('secure area ok, admin')
            elseif token == nil then
                ngx.exit(401)
            else
                ngx.exit(403)
            end
        ";
    }

    # --- S7 WebSocket 聊天隧道（101 升级 + 双向管道） ---
    location = /ws {
        proxy_pass http://127.0.0.1:9301;
        proxy_read_timeout 30;
    }

    # --- S8 健康端点：读后台定时器写入的共享字典 ---
    location = /health {
        content_by_lua "
            local h = ngx.shared.health
            ngx.say('beats=', tostring(h:get('beats') or 0))
            ngx.say('last_beat=', tostring(h:get('last_beat') or 0))
            ngx.say('note=', tostring(h:get('note') or ''))
        ";
    }

    # --- S9 上游超时：慢后端 1.5s > read_timeout 1s → 504 ---
    location = /timeout {
        proxy_pass http://127.0.0.1:9201/slow;
        proxy_read_timeout 1;
    }

    # --- S10 上游宕机：死端口 → 502 ---
    location = /down {
        proxy_pass http://127.0.0.1:9799/;
    }
}
