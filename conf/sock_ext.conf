# cosocket 扩展 API E2E：receiveany / receiveuntil / shutdown / setsize / setkeepalive 真实连接池。
# 后端由 tools/sock_ext_e2e.py 拉起：
#   18134 常驻 echo（每条回 ECHO:<line>#<connid>，跨请求复用同一连接 → connid 不变即证明池命中）
#   18135 shutdown 后端（读到写半关闭的 EOF 后回 AFTER-EOF，证明 write 优雅关闭 + read 仍可用）
#   18136 一次吐 10 字节 "0123456789"（供 receiveany 分段与 setsize 超限）
#   18137 发送 HEAD-A\r\nHEAD-B\r\n\r\nTAIL（供 receiveuntil 截断到分隔符）
error_log "logs/sock_ext_err.log" info;
access_log "logs/sock_ext_access.log";

server {
    listen 127.0.0.1:18133;
    server_name sockext.local;

    # 连接池复用：connect→send→receive→setkeepalive；第二次请求应命中池（reused + 同 connid）
    location /ka {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok, err = sock:connect('127.0.0.1', 18134)
            if not ok then ngx.say('connect:', err) return end
            sock:send('probe\\n')
            local line = sock:receive('*l')
            local kaok, kaerr = sock:setkeepalive(60, 8)
            ngx.say('line:', line, ' reused:', tostring(err), ' ka:', tostring(kaok), ' kaerr:', tostring(kaerr))
        ";
    }

    # 写半关闭：send 后 shutdown()（both→FIN），后端收到 EOF 回 AFTER-EOF，本端仍能 receive
    location /shut {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok, err = sock:connect('127.0.0.1', 18135)
            if not ok then ngx.say('connect:', err) return end
            sock:send('BYE\\n')
            local sok, serr = sock:shutdown()
            local line = sock:receive('*l')
            ngx.say('shutdown:', tostring(sok), ' serr:', tostring(serr), ' after:', tostring(line))
            sock:close()
        ";
    }

    # receiveany：先取 6 字节（min=4），再取剩余
    location /any {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok = sock:connect('127.0.0.1', 18136)
            if not ok then ngx.say('connect failed') return end
            local a = sock:receiveany(4, 6)
            local b = sock:receiveany(2, 0)
            ngx.say('a:', tostring(a), ' b:', tostring(b))
            sock:close()
        ";
    }

    # receiveuntil：迭代器读到 \\r\\n\\r\\n 为止，返回分隔符之前的头
    location /until {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok = sock:connect('127.0.0.1', 18137)
            if not ok then ngx.say('connect failed') return end
            local it = sock:receiveuntil('\\r\\n\\r\\n')
            local headers = it()
            ngx.say('headers:', tostring(headers))
            sock:close()
        ";
    }

    # setsize：限 4 字节缓冲，receive(10) 应报 exceeds
    location /cap {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:setsize(4)
            sock:settimeout(2000)
            local ok = sock:connect('127.0.0.1', 18136)
            if not ok then ngx.say('connect failed') return end
            local d, e = sock:receive(10)
            ngx.say('d:', tostring(d), ' e:', tostring(e))
            sock:close()
        ";
    }
}
