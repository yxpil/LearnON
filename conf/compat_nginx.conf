# ============================================================
# LearnON nginx 语法兼容性专项测试（端口 8090）
# 覆盖：^~ / ~* location、server_name 通配符、error_page、
#       try_files、index、autoindex、alias、client_max_body_size、return URL
# ============================================================

# 默认 server：Host 精确匹配 compat.local 或 *.wild.test
server {
    listen 8090;
    server_name compat.local *.wild.test;
    root "../public_compat";
    client_max_body_size 1k;
    error_page 404 /err404.html;
    error_page 500 /err500.html;

    location = /exact { return 200 "exact"; }

    # return <URL> 简写：等价 302 重定向
    location = /r302 { return /exact; }

    # ~* 大小写不敏感正则
    location ~* \.PNG$ { return 200 "regex-i"; }

    # 普通正则（配置顺序在前，^~ 未命中时正则优先于普通前缀）
    location ~ ^/rege[x] { return 200 "regex"; }

    # ^~ 前缀：命中即赢过正则（上面 ~ ^/rege 匹配不到它，但 ~ ^/care 能）
    location ^~ /caretprefix/ { return 200 "caret"; }
    location ~ ^/care { return 200 "regex-should-lose"; }

    # try_files：文件 → 目录 → 内部重定向兜底
    location /files/ {
        try_files $uri $uri/ /fallback.html;
    }

    # autoindex：目录列表
    location /docs/ {
        autoindex on;
    }

    # alias：/up/ 之后的部分映射到 public/
    location /up/ {
        alias "../public/";
    }

    # index 指令多值
    location /home/ {
        index index.htm index.html;
    }

    location / { }
}

# 第二个 server：验证 server_name 通配符路由
server {
    listen 8090;
    server_name other.site;
    location / { return 200 "other-site"; }
}
