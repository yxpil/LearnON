# header_filter_by_lua + body_filter_by_lua 对代理响应生效 E2E ——
# 后端返回 "hello world"（text/plain，带 X-Backend 头），网关在代理回传路径上缓冲并运行过滤器：
#   /body : body_filter 把 ngx.arg[1] 大写 → 客户端收到 HELLO WORLD（且 X-Backend 透传保留）；
#   /hdr  : header_filter 改 ngx.status=203、加 X-Filtered、改 content-type=application/json；
#   /both : 两个过滤器同时生效。
error_log "logs/proxy_filter_e2e_err.log" info;

upstream becho {
    server 127.0.0.1:18163;
}

server {
    listen 127.0.0.1:18162;
    server_name proxyfilter.local;

    location /ping {
        content_by_lua "ngx.say('pong')";
    }

    location /body {
        proxy_pass http://becho;
        body_filter_by_lua "
            local c = ngx.arg[1]
            if ngx.arg[2] then
                ngx.arg[1] = string.upper(c)
            end
        ";
    }

    location /hdr {
        proxy_pass http://becho;
        header_filter_by_lua "
            ngx.status = 203
            ngx.header['X-Filtered'] = 'yes'
            ngx.header['content-type'] = 'application/json'
        ";
    }

    location /both {
        proxy_pass http://becho;
        header_filter_by_lua "
            ngx.header['X-Filtered'] = 'yes'
        ";
        body_filter_by_lua "
            if ngx.arg[2] then
                ngx.arg[1] = string.upper(ngx.arg[1]) .. '!'
            end
        ";
    }
}
