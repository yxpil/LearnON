# HTTP/3 (QUIC) serving E2E —— 用真实 QUIC/h3 流量证明 HTTP/3 服务真的可用：
#   * `listen ... quic`（隐含 ssl）→ 同端口上 TCP-TLS 提供 h1/h2 并广播 Alt-Svc，UDP 提供 h3
#   * h3 单请求 / 多路复用并发流（自研 quinn+h3 客户端 lon-h3check，因本机 curl/node 无 h3）
#   * 同一端口的 HTTP/1.1（curl --http1.1 -k）仍可用，并携带 alt-svc: h3
# 端口与其它套件错开（18127）。证书复用 certs_scenario/（SAN 含 localhost / h3.local）。
error_log "logs/http3_err.log" info;

server {
    listen 127.0.0.1:18127 ssl quic;
    server_name h3.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";

    location / {
        return 200 "h3-tcp-fallback\n";
    }
    location /hi {
        return 200 "hello-h3\n";
    }
    # 较大响应体：验证 h3 逐帧 send_data 把整块字节完整送到对端（探针按长度校验）
    location /big {
        content_by_lua '
            ngx.header["content-type"] = "text/plain"
            ngx.say(string.rep("h3-", 5000))
        ';
    }
}
