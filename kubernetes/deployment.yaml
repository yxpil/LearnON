apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnon-gateway
  namespace: default
  labels:
    app: learnon
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnon
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: learnon
        component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: learnon
          image: yxpil/learnon:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/conf
              readOnly: true
            - name: certs
              mountPath: /app/certs
              readOnly: true
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: config
          configMap:
            name: learnon-config
        - name: certs
          secret:
            secretName: learnon-certs
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: learnon-gateway
  labels:
    app: learnon
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app: learnon
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: learnon-config
data:
  learnon.conf: |
    # LearnON Gateway Configuration
    worker_connections 10240;
    
    events {
        worker_connections 10240;
    }
    
    http {
        include       mime.types;
        default_type  application/octet-stream;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        keepalive_timeout 65;
        keepalive_requests 1000;
        
        client_max_body_size 10m;
        client_header_timeout 15s;
        client_body_timeout 30s;
        
        error_log /app/logs/error.log warn;
        access_log /app/logs/access.log;
        
        server {
            listen 80;
            server_name localhost;
            
            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
            
            location /health {
                return 200 'OK';
                add_header Content-Type text/plain;
            }
        }
    }
