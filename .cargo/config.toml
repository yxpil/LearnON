# Cross-compilation linkers for ARM / RISC-V Linux targets.
# Without these, cargo links with the host `cc` + bundled lld, which rejects
# the aarch64-only `-Wl,--fix-cortex-a53-843419` flag that rustc emits for
# aarch64-unknown-linux-gnu. Pointing at the cross gcc selects the right
# target-aware linker.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"
